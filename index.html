<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DANOverkill's Tic-Tac-Toe</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
 <!-- link to main.js-->
  <script type="module" src="main.js" defer></script>
</head>
<body>
  <section id="setupScreen">
    <h1 id="nameHeader">Tic-Tac-Toe</h1>
    <h2>Game Setup</h2>
    <input id="player1Name" placeholder="Player 1 name" />
      <label>
      <input type="checkbox" id="player1IsAI" />
      Make Player 1 Ai
    </label>
    <input id="player2Name" placeholder="Player 2 name" />
    <label>
      <input type="checkbox" id="player2IsAI" />
      Make Player 2 Ai
    </label>
    <button id="startGameBtn" disabled>Start Game</button>
  </section>

  <section id="gameScreen" class="hidden">
    <h2 id="gameStatus">Let's play!</h2>
    <div id="scoreBoard"></div>
    <div id="board"></div>
    <div id="spinner"></div>
    <div id="winMessage"></div>
  </section>

  <section id="bottomUi">
    <button id="restartBtn">Restart</button>
  </section>

  <footer>
    <small>©DANOverkill - 2025</small>
  </footer>
</body>
</html>
